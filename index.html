.warn{font-size:.85rem;color:#a3361b;background:#fff0eb;border-radius:12px;padding:6px 10px}
.okn{font-size:.85rem;color:var(--ok);background:var(--okbg);border-radius:12px;padding:6px 10px}

footer{text-align:center;color:var(--mute);font-size:.8rem;padding:20px 10px 40px}
.big{display:block;text-decoration:none;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(140,80,40,.14);margin-top:-18px;position:relative}

.list a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;background:#fff;border-radius:16px;padding:12px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(140,80,40,.07)}
